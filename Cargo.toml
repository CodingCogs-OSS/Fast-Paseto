[package]
name = "fast-paseto"
version = "0.0.1"
edition = "2024"

[lib]
name = "fast_paseto"
crate-type = ["cdylib"]

[dependencies]
pyo3 = "0.27.0"

# Cryptographic primitives
blake2 = "0.10"
chacha20 = "0.9"
ed25519-dalek = { version = "2.1", features = ["rand_core", "pkcs8", "pem"] }
rand = "0.8"
subtle = "2.5"  # Constant-time comparisons

# P-384 ECDSA for v3.public tokens (NIST-compliant)
p384 = { version = "0.13", features = ["ecdsa", "pem", "pkcs8"] }
sha2 = "0.10"  # SHA-384 for v3 tokens

# AES for v3.local tokens
aes = "0.8"
ctr = "0.9"
hmac = "0.12"
hkdf = "0.12"

# Serialization
base64 = "0.22"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Error handling
thiserror = "2.0"

# Password-based key derivation
argon2 = "0.5"

[dev-dependencies]
proptest = "1.5"
